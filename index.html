
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asylkhan - Smart Kids</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🧠 Asylkhan is a Very Smart Child!</h1>
        <p>Welcome to the world of knowledge!</p>
    </header>

    <main>
        <section class="hero">
            <h2>Are you ready to learn?</h2>
            <p>Test your brain and become smarter every day!</p>
            <button onclick="startQuiz()">Start Quiz 🚀</button>
        </section>

        <section class="game">
            <h2>🧩 Brain Challenge</h2>
            <p id="question">Click Start Quiz to begin!</p>

            <div id="answers"></div>

            <p id="result"></p>
            <p id="score">⭐ Score: 0</p>
        </section>
    </main>

    <footer>
        <p>Made with ❤️ for smart kids | 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
